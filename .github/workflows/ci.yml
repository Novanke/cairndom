name: Check CairnDom and real graph analysis
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install verified official MoonBit
        shell: bash
        env:
          MOONBIT_INSTALL_VERSION: '0.10.20+65efd5b93'
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -Command 'irm https://cli.moonbitlang.com/install/powershell.ps1 | iex'
            echo "$USERPROFILE/.moon/bin" >> "$GITHUB_PATH"
          else
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          fi
      - name: Verify supported backends and file workflow
        shell: bash
        run: |
          moon version --all
          moon fmt --check
          moon info
          git diff --exit-code -- '*.mbti'
          moon check --target wasm-gc --deny-warn
          moon check --target js --deny-warn
          moon test --target wasm-gc --deny-warn
          moon test --target js --deny-warn
          moon build --target js --release --deny-warn
          moon run examples/sdk --target wasm-gc --release --deny-warn
          moon run examples/sdk --target js --release --deny-warn
          moon run examples/ssa_sdk --target wasm-gc --release --deny-warn
          moon run examples/ssa_sdk --target js --release --deny-warn
          moon run examples/query_sdk --target wasm-gc --release --deny-warn
          moon run examples/query_sdk --target js --release --deny-warn
          python scripts/verify_cli.py
          python scripts/verify_ssa_cli.py
          python scripts/verify_queries.py
          python scripts/verify_stdout.py
